name: MAHA quality checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maha-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run content and feature tests
        run: npm test

  browser:
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Check main MAHA experience and Content Studio
        run: node qa/four-phase-smoke.mjs
      - name: Check the private localhost preview in both engines
        run: node qa/private-preview-smoke.mjs
      - name: Verify new travel map, destination cards, dream diary and letter UI
        run: node qa/maha-redesign-smoke.mjs
      - name: Full responsive visual sweep (manual workflow only)
        if: github.event_name == 'workflow_dispatch'
        run: node qa/responsive.mjs
